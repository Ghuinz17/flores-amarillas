<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas</title>
<meta name="description" content="Un árbol de girasoles en forma de corazón.">
<meta name="theme-color" content="#f7f3e6">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Parisienne&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<link rel="stylesheet" href="./style/style.css">
</head>
<body>

<main class="stage" id="stage">

  <!-- Lienzo: flor, semilla, árbol, girasoles y pétalos -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Línea del suelo -->
  <div class="ground" id="ground" aria-hidden="true"></div>

  <!-- La carta, se escribe sola -->
  <article class="letter" id="letter" aria-live="polite">
    <h1 class="letter__title" id="ln-title"></h1>
    <p class="letter__body" id="ln-1"></p>
    <p class="letter__body" id="ln-2"></p>
    <p class="letter__body" id="ln-3"></p>
    <p class="letter__body letter__body--end" id="ln-4"></p>
    <p class="signature" id="signature">Eres el sol que hace florecer cada uno de mis días.</p>
  </article>

  <!-- Zona sensible: justo encima de la flor -->
  <button class="start" id="start" type="button" aria-label="Plantar la semilla"></button>

  <button class="replay" id="replay" type="button" hidden>Verlo otra vez</button>

</main>

<script src="./scritps/scritpt.js"></script>
</body>
</html>
